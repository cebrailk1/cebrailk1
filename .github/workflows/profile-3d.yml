# Ablage im Repo: .github/workflows/profile-3d.yml
# Erzeugt täglich den 3D-Contribution-Graph unter profile-3d-contrib/
# Private Contributions mitzählen: Personal Access Token als Secret (z. B. GH_PAT)
# anlegen und unten ${{ secrets.GITHUB_TOKEN }} durch ${{ secrets.GH_PAT }} ersetzen.
name: GitHub-Profile-3D-Contrib

on:
  schedule:
    - cron: "0 18 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    name: generate-github-profile-3d-contrib
    steps:
      - uses: actions/checkout@v6
      - uses: yoshi389111/github-profile-3d-contrib@latest
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}
      - name: Commit & Push
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add -A .
          git commit -m "chore: update 3D contribution graph" || exit 0
          git push
